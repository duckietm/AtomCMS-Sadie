name: Fix Code Style

on: [push]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, pint

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment for Pint
        run: |
          # Copy an env file (prefer .env.example, fallback to .env.testing.example)
          if [ -f .env.example ]; then
            cp .env.example .env
          elif [ -f .env.testing.example ]; then
            cp .env.testing.example .env
          else
            echo "No .env.example or .env.testing.example found"
            exit 1
          fi

          # Generate application key (non-interactive)
          php artisan key:generate --no-interaction

          # Force in-memory SQLite for CI (fast, no file needed)
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

          # Run migrations in memory so tables exist during app boot
          php artisan migrate --force

      - name: Run Pint
        run: ./vendor/bin/pint

      - name: Commit linted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: fix code style with Laravel Pint'
          file_pattern: '*.php'